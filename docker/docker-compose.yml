# Local infrastructure for the twitter app: Kafka + Redis. PostgreSQL runs on the host (port 5433).
# Usage: see docker/README.md
name: twitter

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: twitter-kafka
    ports:
      - "9092:9092"
    environment:
      # Single node in KRaft mode: the same process is broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  redis:
    image: redis:7.4.2
    container_name: twitter-redis
    # Host port 6380, not 6379: avoids clashing with a Redis already installed on the machine.
    ports:
      - "6380:6379"
    # AOF persistence: timelines survive a container restart (they can also be rebuilt, but that is slow).
    # Memory cap as a safety net behind the 7-day timeline TTL: when full, Redis evicts the least recently
    # used keys. Safe because everything in this Redis is a cache that the app can rebuild from PostgreSQL.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
