spring:
  application:
    name: twitter
  datasource:
    url: jdbc:postgresql://localhost:5433/twitter
    username: postgres
    password: Genius33Frozen
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for all in-sync replicas; idempotence stops broker-side duplicates on producer retries.
      acks: all
      properties:
        enable.idempotence: true
        # send() blocks up to this long when the broker is unreachable (default 60 s) while holding outbox row locks.
        max.block.ms: 5000
    consumer:
      # A new consumer group starts from the beginning, so no event published before it existed is skipped.
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8080}

twitter:
  timeline:
    # Accounts with at least this many followers become "celebrities": their tweets are not pushed into
    # followers' timelines (fan-out on write) but pulled when a follower reads (fan-out on read).
    celebrity-threshold: ${CELEBRITY_THRESHOLD:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
